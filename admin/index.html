<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyRestaurantAI — Accesso</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-logo">MyRestaurantAI</div>
    <p class="auth-sub">Pannello di gestione</p>

    <form id="login-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="la-tua@email.it" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <p id="login-error" class="error-msg"></p>
      <button type="submit" class="btn-primary" id="btn-login">Accedi</button>
    </form>
  </div>

  <script type="module">
    import { handleLogin, requireNoAuth } from './js/auth.js';
    requireNoAuth();
    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      btn.disabled    = true;
      btn.textContent = 'Accesso in corso...';
      await handleLogin(
        document.getElementById('email').value,
        document.getElementById('password').value,
        msg => {
          document.getElementById('login-error').textContent = msg;
          btn.disabled    = false;
          btn.textContent = 'Accedi';
        }
      );
    });
  </script>
</body>
</html>
